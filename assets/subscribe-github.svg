<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="100%" height="100%" viewBox="0 0 2084 784" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" image-rendering="optimizeQuality" version="1.1"
     xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     xml:space="preserve"
     xmlns:serif="http://www.serif.com/"
     style="fill-rule:evenodd;clip-rule:evenodd;">

  <defs>
    <!-- Galaxy gradient -->
    <radialGradient id="galaxyGradient" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#4b1d6d"/>
      <stop offset="40%" stop-color="#2a1a47"/>
      <stop offset="100%" stop-color="#0b0b20"/>
    </radialGradient>

    <!-- Nebula purples/blues -->
    <radialGradient id="nebulaPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a45ee5" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="nebulaBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4cc9f0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>

    <!-- Clip path for rounded edges -->
    <clipPath id="_clip2">
      <path d="M2074.65,147.571v486.108c0,76.659 -62.233,138.892 -138.891,138.892H147.569c-76.659,0 -138.892,-62.233 -138.892,-138.892V147.571c0,-76.658 62.233,-138.892 138.892,-138.892h1788.19c76.658,0 138.891,62.234 138.891,138.892Z"/>
    </clipPath>
  </defs>

  <!-- Galaxy base -->
  <rect width="100%" height="100%" fill="url(#galaxyGradient)" clip-path="url(#_clip2)" />

  <!-- Nebula clouds -->
  <g clip-path="url(#_clip2)">
    <circle cx="600" cy="300" r="400" fill="url(#nebulaPurple)" opacity="0.7"/>
    <circle cx="1500" cy="500" r="500" fill="url(#nebulaBlue)" opacity="0.6"/>
    <circle cx="1000" cy="150" r="350" fill="url(#nebulaPurple)" opacity="0.5"/>
  </g>

  <!-- Static stars -->
  <g clip-path="url(#_clip2)" opacity="0.8">
    <circle cx="300" cy="200" r="3" fill="white"/>
    <circle cx="1800" cy="600" r="2.4" fill="white"/>
    <circle cx="1200" cy="250" r="2" fill="white"/>
    <circle cx="1600" cy="150" r="3.6" fill="white"/>
    <circle cx="800" cy="500" r="2.6" fill="white"/>
    <circle cx="400" cy="600" r="2" fill="white"/>
    <circle cx="1000" cy="700" r="3" fill="white"/>
  </g>

  <!-- Frame border -->
  <path d="M2074.65,147.571v486.108c0,76.659 -62.233,138.892 -138.891,138.892H147.569c-76.659,0 -138.892,-62.233 -138.892,-138.892V147.571c0,-76.658 62.233,-138.892 138.892,-138.892h1788.19c76.658,0 138.891,62.234 138.891,138.892Z"
        style="fill:none;stroke:#ffffff;stroke-opacity:0.65;stroke-width:18pt;"/>

<!-- Warp stars -->
<g clip-path="url(#_clip2)" opacity="0.7">
  <circle cx="220" cy="120" r="12" fill="#fff"/>
  <circle cx="1720" cy="260" r="14" fill="#fff"/>
  <circle cx="380" cy="680" r="16" fill="#fff"/>
  <circle cx="1860" cy="740" r="24" fill="#fff"/>
