  <circle cx="1100" cy="620" r="18" fill="#fff"/>
  <circle cx="1200" cy="100" r="20" fill="#fff"/>
  <circle cx="600" cy="500" r="10" fill="#fff"/>
  <circle cx="1500" cy="580" r="22" fill="#fff"/>
  <circle cx="800" cy="240" r="13" fill="#fff"/>
</g>



